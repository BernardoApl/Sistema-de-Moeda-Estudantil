{% extends 'base.html' %}{% block content %}<h1>{{ 'Editar' if dados.id else 'Cadastrar' }} vantagem</h1><form method="post" class="painel formulario"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Descrição *<textarea name="descricao" required maxlength="500">{{ dados.descricao|default('') }}</textarea></label><label>URL da foto *<input name="foto" type="url" required value="{{ dados.foto|default('') }}"><small>Use uma imagem acessível por HTTP ou HTTPS.</small></label><label>Custo em moedas *<input name="custo" type="number" min="1" max="1000000000" required value="{{ dados.custo|default('') }}"></label><button>Salvar vantagem</button> <a href="{{ url_for('web.index') }}">Voltar</a></form>{% endblock %}
